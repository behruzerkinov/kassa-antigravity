name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kassa-pos
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kassa-pos/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kassa-pos/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist-assets
          # Ship exactly one Windows installer. The NSIS bundle is the installable
          # build; the loose portable exe is published only as a fallback for the
          # rare case where no NSIS bundle was produced.
          shopt -s nullglob
          nsis=(src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#nsis[@]} -gt 0 ]; then
            cp "${nsis[0]}" dist-assets/kassa-installer.exe
          else
            cp src-tauri/target/release/kassa-pos.exe dist-assets/kassa-installer.exe
          fi
          gh release create "$TAG" dist-assets/kassa-installer.exe \
            --title "Kassa POS $TAG" --generate-notes --verify-tag \
            || gh release upload "$TAG" dist-assets/kassa-installer.exe --clobber
